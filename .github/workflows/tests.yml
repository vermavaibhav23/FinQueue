name: Django tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MySQL development headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Django tests on SQLite
        run: python manage.py test --settings=finqueue.test_settings
